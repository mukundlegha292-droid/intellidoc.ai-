name: One-time URL title frontend fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[skip title fix]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch URL import title usage
        shell: python
        run: |
          from pathlib import Path

          path = Path('src/routes/ai-workspace.tsx')
          text = path.read_text(encoding='utf-8')

          old = 'return { text: (doc.body?.innerText ?? doc.documentElement.textContent ?? "").replace(/\\s+\\n/g, "\\n").replace(/\\n{3,}/g, "\\n\\n").trim(), meta: parsed.hostname, note: "Web page text imported" };'
          new = 'const pageTitle = (doc.title || parsed.hostname).replace(/\\s*[-|]\\s*YouTube\\s*$/i, "").trim() || parsed.hostname; return { text: (doc.body?.innerText ?? doc.documentElement.textContent ?? "").replace(/\\s+\\n/g, "\\n").replace(/\\n{3,}/g, "\\n\\n").trim(), meta: pageTitle, note: "Web page text imported" };'
          if old not in text:
              raise SystemExit('title extraction pattern not found')
          text = text.replace(old, new, 1)

          old2 = 'try { const parsed = new URL(value); processResult(await importUrl(value, setStatus), parsed.hostname + parsed.pathname); setShowUrl(false); }'
          new2 = 'try { const parsed = new URL(value); const result = await importUrl(value, setStatus); processResult(result, result.meta || parsed.hostname + parsed.pathname); setShowUrl(false); }'
          if old2 not in text:
              raise SystemExit('display-name pattern not found')
          text = text.replace(old2, new2, 1)

          path.write_text(text, encoding='utf-8')

      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/ai-workspace.tsx
          git diff --cached --quiet && exit 0
          git commit -m "fix URL import display title [skip title fix]"
          git push