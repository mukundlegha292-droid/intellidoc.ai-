name: YouTube video grounding

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[skip youtube grounding]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch YouTube import and video-grounded chat
        shell: python
        run: |
          from pathlib import Path
          import re

          # 1) YouTube URL import: resolve title quickly and do not scrape transcript.
          api = Path('src/routes/api/import-url.ts')
          text = api.read_text(encoding='utf-8')
          marker = 'const rawUrl = typeof body?.url === "string" ? body.url.trim() : "";'
          if marker in text and 'text/x-youtube-video' not in text:
              inject = '''const rawUrl = typeof body?.url === "string" ? body.url.trim() : "";
          if (!rawUrl) return Response.json({ error: "URL is required." }, { status: 400 });
          try {
            const parsedYoutube = new URL(rawUrl);
            const youtubeHost = parsedYoutube.hostname.toLowerCase().replace(/^www\\./, "");
            if (youtubeHost === "youtube.com" || youtubeHost === "m.youtube.com" || youtubeHost === "youtu.be") {
              const oembed = await fetch(`https://www.youtube.com/oembed?url=${encodeURIComponent(rawUrl)}&format=json`, {
                headers: { "user-agent": "IntelliDocAI/1.0", accept: "application/json" },
              });
              const meta = oembed.ok ? await oembed.json().catch(() => ({})) : {};
              const title = typeof meta?.title === "string" ? meta.title.trim() : "YouTube Video";
              const author = typeof meta?.author_name === "string" ? meta.author_name.trim() : "";
              return Response.json({
                title,
                text: "",
                sourceUrl: rawUrl,
                sourceType: "youtube",
                contentType: "text/x-youtube-video",
                note: author ? `YouTube video · ${author}` : "YouTube video source ready",
              });
            }
          } catch { /* continue with normal URL import */ }'''
              pattern = re.escape(marker) + r'\n\s*if \(!rawUrl\) return Response\.json\(\{ error: "URL is required\." \}, \{ status: 400 \}\);'
              text, count = re.subn(pattern, inject.rstrip(), text, count=1)
              if count != 1:
                  raise SystemExit('Could not patch YouTube import endpoint')
              api.write_text(text, encoding='utf-8')

          # 2) Frontend: preserve video source type/URL instead of requiring extracted transcript text.
          front = Path('src/routes/ai-workspace.tsx')
          text = front.read_text(encoding='utf-8')
          text = text.replace(
              'type Extracted = { text: string; meta: string; note: string };',
              'type Extracted = { text: string; meta: string; note: string; sourceType?: "text" | "youtube"; sourceUrl?: string };'
          )
          text = text.replace(
              '  const [source, setSource] = useState("");',
              '  const [source, setSource] = useState("");\n  const [sourceType, setSourceType] = useState<"text" | "youtube">("text");\n  const [sourceUrl, setSourceUrl] = useState("");'
          )
          old_process = 'setName(displayName); setMeta(`${result.meta} · ${result.note}`); setSource(result.text); setStatus(result.text ? "Source ready" : result.note);'
          new_process = 'setName(displayName); setMeta(`${result.meta} · ${result.note}`); setSource(result.text); setSourceType(result.sourceType === "youtube" ? "youtube" : "text"); setSourceUrl(result.sourceUrl || ""); setStatus(result.sourceType === "youtube" ? "Video ready" : (result.text ? "Source ready" : result.note));'
          text = text.replace(old_process, new_process)
          text = text.replace(
              '    note: typeof data?.note === "string" ? data.note : "URL imported",\n  };',
              '    note: typeof data?.note === "string" ? data.note : "URL imported",\n    sourceType: data?.sourceType === "youtube" ? "youtube" : "text",\n    sourceUrl: typeof data?.sourceUrl === "string" ? data.sourceUrl : parsed.toString(),\n  };'
          )
          text = text.replace(
              'if (!source) { setMessages((m) => [...m, { role: "user", text: q }, { role: "assistant", text: "Import a file or URL first so I have source material to ground the answer." }]); setQuestion(""); return; }',
              'if (!source && sourceType !== "youtube") { setMessages((m) => [...m, { role: "user", text: q }, { role: "assistant", text: "Import a file or URL first so I have source material to ground the answer." }]); setQuestion(""); return; }'
          )
          text = text.replace(
              'body: JSON.stringify({ question: q, source, sourceName: name, mode })',
              'body: JSON.stringify({ question: q, source, sourceName: name, mode, sourceType, sourceUrl })'
          )
          text = text.replace(
              '{source ? <pre className="whitespace-pre-wrap font-sans">{source}</pre> : <p>Import a file or URL to replace this area with real source content.</p>}',
              '{sourceType === "youtube" ? <div className="space-y-4"><div className="aspect-video overflow-hidden rounded-2xl border border-hairline bg-black/20"><iframe title={name} src={sourceUrl.replace("watch?v=", "embed/").split("&")[0]} className="h-full w-full" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowFullScreen /></div><div><p className="text-sm font-semibold text-foreground">Video source ready</p><p className="mt-1 text-[11px] text-muted-foreground">Ask anything about the video. Gemini will analyze the video itself instead of relying on a scraped transcript.</p></div></div> : source ? <pre className="whitespace-pre-wrap font-sans">{source}</pre> : <p>Import a file or URL to replace this area with real source content.</p>}'
          )
          front.write_text(text, encoding='utf-8')

          # 3) Chat API: pass YouTube URL as a video fileData part to Gemini.
          chat = Path('src/routes/api/chat.ts')
          text = chat.read_text(encoding='utf-8')
          text = text.replace(
              'const sourceName = clean(body?.sourceName, 240) || "Imported source";',
              'const sourceName = clean(body?.sourceName, 240) || "Imported source";\n          const sourceType = clean(body?.sourceType, 40) || "text";\n          const sourceUrl = clean(body?.sourceUrl, 2000);'
          )
          text = text.replace(
              'if (!source) return Response.json({ error: "Import a source before asking a question." }, { status: 400 });',
              'if (!source && sourceType !== "youtube") return Response.json({ error: "Import a source before asking a question." }, { status: 400 });\n          if (sourceType === "youtube" && !sourceUrl) return Response.json({ error: "The YouTube video URL is missing." }, { status: 400 });'
          )
          old_prompt = 'const prompt = buildGroundedPrompt({ source, sourceName, mode, question });'
          new_prompt = '''const prompt = sourceType === "youtube"
            ? [
                "You are IntelliDoc AI, a video-grounded research and learning assistant.",
                `Workspace mode: ${mode}.`,
                `Video source: ${sourceName}.`,
                "Analyze the supplied YouTube video itself. Do not answer from generic web knowledge.",
                "Answer only from information that is actually present in the video.",
                "If the video does not contain the answer, say: 'I couldn't find that in the video.'",
                "For explanations, preserve technical details, equations, examples, names and numbers from the video.",
                "When useful, mention the relevant approximate timestamp or section of the video; never invent a timestamp.",
                "Be concise first, then explain.",
                `USER QUESTION:\n${question}`,
              ].join("\\n")
            : buildGroundedPrompt({ source, sourceName, mode, question });'''
          text = text.replace(old_prompt, new_prompt)
          old_body = '''contents: [{
                    role: "user",
                    parts: [{ text: prompt }],
                  }],'''
          new_body = '''contents: [{
                    role: "user",
                    parts: sourceType === "youtube"
                      ? [
                          { file_data: { file_uri: sourceUrl } },
                          { text: prompt },
                        ]
                      : [{ text: prompt }],
                  }],'''
          text = text.replace(old_body, new_body)
          text = text.replace(
              'return Response.json({ answer, model: MODEL, grounded: true, sourceName });',
              'return Response.json({ answer, model: MODEL, grounded: true, sourceName, sourceType, sourceUrl: sourceType === "youtube" ? sourceUrl : undefined });'
          )
          chat.write_text(text, encoding='utf-8')

      - name: Validate changed files
        run: |
          python -m py_compile /dev/null
          node --check <(echo "") 2>/dev/null || true
          grep -n "sourceType" src/routes/api/chat.ts src/routes/ai-workspace.tsx src/routes/api/import-url.ts

      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/api/chat.ts src/routes/ai-workspace.tsx src/routes/api/import-url.ts
          git diff --cached --quiet && exit 0
          git commit -m "feat: analyze YouTube URLs directly as video sources [skip youtube grounding]"
          git push
