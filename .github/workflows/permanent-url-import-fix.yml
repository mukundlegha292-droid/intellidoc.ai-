name: Permanent URL import title fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[skip permanent url fix]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch backend and frontend URL import
        shell: python
        run: |
          from pathlib import Path
          import re

          api = Path('src/routes/api/import-url.ts')
          text = api.read_text(encoding='utf-8')

          helper = '''\nasync function getYouTubeTitle(rawUrl: string) {\n  try {\n    const hostname = new URL(rawUrl).hostname.toLowerCase();\n    if (!hostname.includes('youtube.com') && hostname !== 'youtu.be' && !hostname.endsWith('.youtube.com')) return '';\n    const oembed = await fetch(`https://www.youtube.com/oembed?url=${encodeURIComponent(rawUrl)}&format=json`, {\n      signal: AbortSignal.timeout(7000),\n      headers: { 'user-agent': 'IntelliDocAI/1.0' },\n    });\n    if (!oembed.ok) return '';\n    const data = await oembed.json().catch(() => null);\n    return typeof data?.title === 'string' ? data.title.trim() : '';\n  } catch {\n    return '';\n  }\n}\n'''
          if 'async function getYouTubeTitle' not in text:
              marker = 'async function fetchWithLimit(url: string) {'
              text = text.replace(marker, helper + '\n' + marker, 1)

          marker = 'const rawUrl = typeof body?.url === "string" ? body.url.trim() : "";'
          inject = '''const rawUrl = typeof body?.url === "string" ? body.url.trim() : "";\n          if (!rawUrl) return Response.json({ error: "URL is required." }, { status: 400 });\n          const youtubeTitle = await getYouTubeTitle(rawUrl);\n          if (youtubeTitle) return Response.json({ title: youtubeTitle.replace(/\\s*[-|]\\s*YouTube\\s*$/i, "").trim(), text: "", sourceUrl: rawUrl, contentType: "text/x-youtube", note: "YouTube video title resolved" });'''
          text = re.sub(re.escape(marker) + r'\n\s*if \(!rawUrl\) return Response\.json\(\{ error: "URL is required\." \}, \{ status: 400 \}\);', inject.rstrip(), text, count=1)
          api.write_text(text, encoding='utf-8')

          front = Path('src/routes/ai-workspace.tsx')
          text = front.read_text(encoding='utf-8')
          pattern = r'async function importUrl\(url: string, status: \(text: string\) => void\): Promise<Extracted> \{.*?\n\}\n\nexport const Route'
          replacement = '''async function importUrl(url: string, status: (text: string) => void): Promise<Extracted> {\n  const parsed = new URL(url);\n  if (!/^https?:$/.test(parsed.protocol)) throw new Error("Only http and https URLs are supported.");\n  status("Fetching source…");\n  const response = await fetch("/api/import-url", {\n    method: "POST",\n    headers: { "content-type": "application/json" },\n    body: JSON.stringify({ url: url.trim() }),\n  });\n  const data = await response.json().catch(() => ({}));\n  if (!response.ok) throw new Error(typeof data?.error === "string" ? data.error : `URL returned ${response.status}.`);\n  if (data?.contentType === "application/pdf") {\n    const pdfResponse = await fetch(`/api/import-url?url=${encodeURIComponent(url.trim())}`);\n    if (!pdfResponse.ok) throw new Error("The PDF could not be fetched.");\n    const blob = await pdfResponse.blob();\n    return extractFile(new File([blob], parsed.pathname.split("/").pop() || "imported.pdf", { type: "application/pdf" }), status);\n  }\n  return { text: typeof data?.text === "string" ? data.text : "", meta: typeof data?.title === "string" ? data.title : parsed.hostname, note: typeof data?.note === "string" ? data.note : "URL imported" };\n}\n\nexport const Route'''
          updated, count = re.subn(pattern, replacement, text, count=1, flags=re.S)
          if count != 1:
              raise SystemExit('frontend importUrl pattern not found')
          front.write_text(updated, encoding='utf-8')

      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/api/import-url.ts src/routes/ai-workspace.tsx
          git diff --cached --quiet && exit 0
          git commit -m "fix permanent URL import title resolution [skip permanent url fix]"
          git push