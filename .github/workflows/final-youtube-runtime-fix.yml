name: Final YouTube runtime fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[skip runtime youtube fix]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch YouTube import, chat API and workspace
        shell: python
        run: |
          from pathlib import Path
          import re

          # 1) YouTube import: short-circuit before transcript extraction.
          p = Path('src/routes/api/import-url.ts')
          t = p.read_text(encoding='utf-8')
          marker = 'async function resolveSource(rawUrl: string): Promise<SourceResult> {\n'
          if marker not in t:
              raise SystemExit('resolveSource marker not found')
          if 'YouTube video source ready. Video ID:' not in t:
              inject = '''async function resolveSource(rawUrl: string): Promise<SourceResult> {\n  const earlyParsed = validateUrl(rawUrl);\n  if (isYouTubeHost(earlyParsed.hostname)) {\n    const videoId = getYouTubeVideoId(rawUrl);\n    const title = (await getYouTubeTitle(rawUrl)) || `YouTube video ${videoId || "source"}`;\n    return {\n      text: "",\n      title,\n      sourceUrl: rawUrl,\n      contentType: "video/youtube",\n      note: "YouTube video ready for direct AI analysis",\n    };\n  }\n'''
              t = t.replace(marker, inject, 1)
              p.write_text(t, encoding='utf-8')

          # 2) Chat API: actual YouTube video input, not transcript text.
          p = Path('src/routes/api/chat.ts')
          t = p.read_text(encoding='utf-8')
          old = '          const sourceName = clean(body?.sourceName, 240) || "Imported source";\n'
          if 'const sourceType = clean(body?.sourceType' not in t:
              t = t.replace(old, old + '          const sourceType = clean(body?.sourceType, 40) || "text";\n          const sourceUrl = clean(body?.sourceUrl, 2_000);\n', 1)
          t = t.replace(
              '          if (!source) return Response.json({ error: "Import a source before asking a question." }, { status: 400 });\n',
              '          const isYouTubeVideo = sourceType === "youtube" || sourceType === "video/youtube";\n          if (!source && !isYouTubeVideo) return Response.json({ error: "Import a source before asking a question." }, { status: 400 });\n          if (isYouTubeVideo && !sourceUrl) return Response.json({ error: "The YouTube video URL is missing." }, { status: 400 });\n',
              1,
          )
          old_prompt = '          const prompt = buildGroundedPrompt({ source, sourceName, mode, question });\n'
          if 'const prompt = isYouTubeVideo' not in t:
              new_prompt = '''          const prompt = isYouTubeVideo\n            ? [\n                "You are IntelliDoc AI analyzing the supplied YouTube video directly.",\n                `Workspace mode: ${mode}.`,\n                `Video source: ${sourceName}.`,\n                "Answer from the actual video content, including spoken explanations, visuals, slides, boards, demonstrations, formulas and on-screen text.",\n                "Do not use any transcript supplied by the application as the basis for the answer.",\n                "If the requested information is not present in the video, say: I couldn't find that in the video.",\n                "Keep answers direct and educational. Mention an approximate timestamp only when you can support it from the video.",\n                `USER QUESTION:\\n${question}`,\n              ].join("\\n")\n            : buildGroundedPrompt({ source, sourceName, mode, question });\n'''
              t = t.replace(old_prompt, new_prompt, 1)
          old_parts = '''                    parts: [{ text: prompt }],\n'''
          if 'file_data: { file_uri: sourceUrl }' not in t:
              new_parts = '''                    parts: isYouTubeVideo\n                      ? [\n                          { file_data: { file_uri: sourceUrl } },\n                          { text: prompt },\n                        ]\n                      : [{ text: prompt }],\n'''
              t = t.replace(old_parts, new_parts, 1)
          t = t.replace(
              'return Response.json({ answer, model: MODEL, grounded: true, sourceName });',
              'return Response.json({ answer, model: MODEL, grounded: true, sourceName, sourceType, sourceUrl: isYouTubeVideo ? sourceUrl : undefined });',
              1,
          )
          p.write_text(t, encoding='utf-8')

          # 3) Frontend: keep URL/type for chat and do not block video-only sources.
          p = Path('src/routes/ai-workspace.tsx')
          t = p.read_text(encoding='utf-8')
          if 'sourceType?: string' not in t:
              t = t.replace(
                  'type Extracted = { text: string; meta: string; note: string };',
                  'type Extracted = { text: string; meta: string; note: string; sourceType?: string; sourceUrl?: string };',
                  1,
              )
          if 'const [sourceType, setSourceType]' not in t:
              t = t.replace(
                  '  const [source, setSource] = useState("");',
                  '  const [source, setSource] = useState("");\n  const [sourceType, setSourceType] = useState("");\n  const [sourceUrl, setSourceUrl] = useState("");',
                  1,
              )
          t = t.replace(
              'setName(displayName); setMeta(`${result.meta} · ${result.note}`); setSource(result.text); setStatus(result.text ? "Source ready" : result.note);',
              'setName(displayName); setMeta(`${result.meta} · ${result.note}`); setSource(result.text); setSourceType(result.sourceType || ""); setSourceUrl(result.sourceUrl || ""); setStatus(result.sourceType ? "Video ready" : (result.text ? "Source ready" : result.note));',
              1,
          )
          # add URL metadata parsing
          if 'sourceUrl: typeof data?.sourceUrl' not in t:
              t = t.replace(
                  '    note: typeof data?.note === "string" ? data.note : "URL imported",\n  };',
                  '    note: typeof data?.note === "string" ? data.note : "URL imported",\n    sourceType: typeof data?.contentType === "string" ? data.contentType : "",\n    sourceUrl: typeof data?.sourceUrl === "string" ? data.sourceUrl : parsed.toString(),\n  };',
                  1,
              )
          t = t.replace(
              'if (!source) { setMessages((m) => [...m, { role: "user", text: q }, { role: "assistant", text: "Import a file or URL first so I have source material to ground the answer." }]); setQuestion(""); return; }',
              'if (!source && !sourceType) { setMessages((m) => [...m, { role: "user", text: q }, { role: "assistant", text: "Import a file or URL first so I have source material to ground the answer." }]); setQuestion(""); return; }',
              1,
          )
          t = t.replace(
              'body: JSON.stringify({ question: q, source, sourceName: name, mode })',
              'body: JSON.stringify({ question: q, source, sourceName: name, mode, sourceType, sourceUrl })',
              1,
          )
          t = t.replace(
              '<article className="mt-4 max-h-[520px] overflow-auto rounded-2xl border border-hairline bg-background/20 p-5 text-xs leading-7 text-muted-foreground">{source ? <pre className="whitespace-pre-wrap font-sans">{source}</pre> : <p>Import a file or URL to replace this area with real source content.</p>}</article>',
              '<article className="mt-4 max-h-[520px] overflow-auto rounded-2xl border border-hairline bg-background/20 p-5 text-xs leading-7 text-muted-foreground">{sourceType === "video/youtube" && sourceUrl ? <div><div className="aspect-video overflow-hidden rounded-2xl border border-hairline bg-black"><iframe title={name} src={sourceUrl.replace("watch?v=", "embed/").split("&")[0]} className="h-full w-full" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowFullScreen /></div><p className="mt-3 text-[11px] text-muted-foreground">Video source ready. Ask questions about the actual video.</p></div> : source ? <pre className="whitespace-pre-wrap font-sans">{source}</pre> : <p>Import a file or URL to replace this area with real source content.</p>}</article>',
              1,
          )
          p.write_text(t, encoding='utf-8')

      - name: Build check
        run: npm run build

      - name: Commit changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/api/import-url.ts src/routes/api/chat.ts src/routes/ai-workspace.tsx
          git diff --cached --quiet && exit 0
          git commit -m "feat: use real YouTube video for grounded answers [skip runtime youtube fix]"
          git push
