name: Fix URL title v2

on:
  push:
    branches: [main]
    paths-ignore:
      - '.github/workflows/fix-url-title-v2.yml'

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[skip url title v2]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch URL title flow
        shell: python
        run: |
          from pathlib import Path
          import re

          ui = Path('src/routes/ai-workspace.tsx')
          s = ui.read_text(encoding='utf-8')

          new_import = '''async function importUrl(url: string, status: (text: string) => void): Promise<Extracted> {
            const parsed = new URL(url);
            if (!/^https?:$/.test(parsed.protocol)) throw new Error("Only http and https URLs are supported.");
            status("Fetching URL…");
            const response = await fetch("/api/import-url", {
              method: "POST",
              headers: { "content-type": "application/json" },
              body: JSON.stringify({ url: parsed.toString() }),
            });
            const data = await response.json().catch(() => ({}));
            if (!response.ok) throw new Error(data?.error || `URL returned ${response.status}.`);
            return {
              text: typeof data?.text === "string" ? data.text : "",
              meta: typeof data?.title === "string" && data.title.trim() ? data.title.trim() : parsed.hostname,
              note: typeof data?.note === "string" ? data.note : "URL imported",
            };
          }'''

          s, n = re.subn(r'async function importUrl\([\s\S]*?\n}\n\nexport const Route', new_import + '\n\nexport const Route', s, count=1)
          if n != 1:
              raise SystemExit('importUrl function not found')

          new_handle = '''  const handleUrl = async () => {
            const value = url.trim();
            if (!value) return;
            setProcessing(true); setError(""); setStatus("Fetching URL…");
            try {
              const result = await importUrl(value, setStatus);
              processResult(result, result.meta || new URL(value).hostname);
              setShowUrl(false);
            } catch (e) {
              console.error(e);
              setStatus("URL import failed");
              setError(e instanceof Error ? e.message : "This URL could not be imported.");
            } finally { setProcessing(false); }
          };'''

          s, n = re.subn(r'  const handleUrl = async \(\) => \{[\s\S]*?\n  \};\n\n  const ask', new_handle + '\n\n  const ask', s, count=1)
          if n != 1:
              raise SystemExit('handleUrl function not found')

          ui.write_text(s, encoding='utf-8')

          api = Path('src/routes/api/import-url.ts')
          a = api.read_text(encoding='utf-8')

          if 'async function getYouTubeTitle' not in a:
              helper = '''\nasync function getYouTubeTitle(rawUrl: string) {\n  try {\n    const parsed = new URL(rawUrl);\n    const host = parsed.hostname.toLowerCase();\n    const isYouTube = host === "youtu.be" || host === "www.youtube.com" || host === "youtube.com" || host.endsWith(".youtube.com");\n    if (!isYouTube) return "";\n    const oembed = `https://www.youtube.com/oembed?url=${encodeURIComponent(rawUrl)}&format=json`;\n    const response = await fetch(oembed, { headers: { "user-agent": "IntelliDocAI/1.0" } });\n    if (!response.ok) return "";\n    const data = await response.json().catch(() => ({}));\n    return typeof data?.title === "string" ? data.title.trim() : "";\n  } catch {\n    return "";\n  }\n}\n'''
              a = a.replace('\nasync function fetchWithLimit', helper + '\nasync function fetchWithLimit', 1)

          if 'const youtubeTitle = await getYouTubeTitle(rawUrl);' not in a:
              a = a.replace('const { contentType, text, url, parsed } = await resolveSource(rawUrl);', 'const { contentType, text, url, parsed } = await resolveSource(rawUrl);\n          const youtubeTitle = await getYouTubeTitle(rawUrl);', 1)

          a = a.replace('title: getTitle(text, parsed.hostname)', 'title: youtubeTitle || getTitle(text, parsed.hostname)', 1)
          api.write_text(a, encoding='utf-8')
          print('Patched URL title flow')

      - name: Commit patch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/routes/ai-workspace.tsx src/routes/api/import-url.ts
          git diff --cached --quiet || git commit -m 'fix URL import to use backend resolved title [skip url title v2]'
          git push
