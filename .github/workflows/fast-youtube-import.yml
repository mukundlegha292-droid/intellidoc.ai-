name: Fast YouTube import

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: contains(github.event.head_commit.message, 'fast youtube import trigger')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Patch workspace YouTube import path
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/routes/ai-workspace.tsx')
          s = p.read_text()
          if 'function isYouTubeUrl(' not in s:
              marker = 'function extOf(name: string) { return name.split(".").pop()?.toLowerCase() ?? ""; }\n'
              helper = '''function isYouTubeUrl(value: string) {\n  try {\n    const host = new URL(value).hostname.toLowerCase().replace(/^www\\./, "");\n    return host === "youtube.com" || host === "m.youtube.com" || host === "youtu.be";\n  } catch { return false; }\n}\n\nfunction youtubeTitleFallback(value: string) {\n  try {\n    const u = new URL(value);\n    const host = u.hostname.replace(/^www\\./, "");\n    const id = host === "youtu.be" ? u.pathname.split("/").filter(Boolean)[0] : (u.searchParams.get("v") || u.pathname.split("/").filter(Boolean).pop() || "");\n    return id ? `YouTube video · ${id}` : "YouTube video";\n  } catch { return "YouTube video"; }\n}\n\n'''
              s = s.replace(marker, marker + helper, 1)
          old = '''  try {\n    const result = await importUrl(value, setStatus);\n    processResult(result, result.meta || new URL(value).hostname);\n    setShowUrl(false);\n  } catch (e) {'''
          new = '''  try {\n    if (isYouTubeUrl(value)) {\n      const displayName = youtubeTitleFallback(value);\n      setName(displayName);\n      setMeta("YouTube video · Connected instantly");\n      setSource("");\n      setSourceUrl(value);\n      setStatus("Video connected");\n      setMessages([{ role: "assistant", text: `${displayName} is connected. You can now ask questions about the video.` }]);\n      setShowUrl(false);\n      return;\n    }\n    const result = await importUrl(value, setStatus);\n    processResult(result, result.meta || new URL(value).hostname);\n    setShowUrl(false);\n  } catch (e) {'''
          if old in s:
              s = s.replace(old, new, 1)
          p.write_text(s)
          PY
      - name: Build
        run: |
          npm ci
          npm run build
      - name: Commit patch and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/ai-workspace.tsx .github/workflows/fast-youtube-import.yml
          git commit -m "feat: make YouTube import instant" || exit 0
          rm .github/workflows/fast-youtube-import.yml
          git add .github/workflows/fast-youtube-import.yml
          git commit --amend --no-edit
          git push
