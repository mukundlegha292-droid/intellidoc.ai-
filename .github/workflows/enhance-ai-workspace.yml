name: Enhance AI workspace

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  enhance:
    if: ${{ !contains(github.event.head_commit.message, '[skip studio ui]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Add source brief and Studio panel
        shell: python
        run: |
          from pathlib import Path

          path = Path('src/routes/ai-workspace.tsx')
          text = path.read_text(encoding='utf-8')

          import_line = 'import StudioPanel from "../components/StudioPanel";\n'
          if import_line not in text:
              marker = 'import type { LucideIcon } from "lucide-react";\n'
              text = text.replace(marker, marker + import_line, 1)

          marker = '      <div className="mt-5 grid gap-5 xl:grid-cols-[minmax(300px,0.85fr)_minmax(420px,1fr)_320px]">'
          panel = '      <StudioPanel source={source} processing={processing} onAsk={ask} />\n'
          if panel.strip() not in text:
              if marker not in text:
                  raise SystemExit('workspace grid marker not found')
              text = text.replace(marker, panel + marker, 1)

          path.write_text(text, encoding='utf-8')

      - name: Commit UI enhancement
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/ai-workspace.tsx src/components/StudioPanel.tsx
          git diff --cached --quiet && exit 0
          git commit -m "feat: add source brief and studio panel [skip studio ui]"
          git push
