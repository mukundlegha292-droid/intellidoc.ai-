name: YouTube title final fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[skip yt final]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Patch source files
        shell: python
        run: |
          from pathlib import Path
          import re

          api = Path('src/routes/api/import-url.ts')
          s = api.read_text(encoding='utf-8')
          if 'async function getYouTubeTitle' not in s:
              helper = '''\nasync function getYouTubeTitle(rawUrl: string) {\n  try {\n    const parsed = new URL(rawUrl);\n    const host = parsed.hostname.toLowerCase().replace(/^www\\./, "");\n    if (!(host === "youtu.be" || host === "youtube.com" || host === "m.youtube.com")) return "";\n    const endpoint = `https://www.youtube.com/oembed?url=${encodeURIComponent(rawUrl)}&format=json`;\n    const response = await fetch(endpoint, { headers: { accept: "application/json", "user-agent": "IntelliDocAI/1.0" } });\n    if (!response.ok) return "";\n    const data = await response.json().catch(() => ({}));\n    return typeof data?.title === "string" ? data.title.trim() : "";\n  } catch { return ""; }\n}\n'''
              marker = '\nasync function fetchWithLimit'
              if marker not in s: raise SystemExit('backend marker missing')
              s = s.replace(marker, helper + marker, 1)
          anchor = 'const { contentType, text, url, parsed } = await resolveSource(rawUrl);'
          if anchor in s and 'const youtubeTitle = await getYouTubeTitle(rawUrl);' not in s:
              s = s.replace(anchor, anchor + '\n          const youtubeTitle = await getYouTubeTitle(rawUrl);', 1)
          s = s.replace('title: getTitle(text, parsed.hostname), text: cleaned,', 'title: youtubeTitle || getTitle(text, parsed.hostname), text: cleaned,', 1)
          api.write_text(s, encoding='utf-8')

          ui = Path('src/routes/ai-workspace.tsx')
          u = ui.read_text(encoding='utf-8')
          new_import = '''async function importUrl(url: string, status: (text: string) => void): Promise<Extracted> {\n  const parsed = new URL(url);\n  if (!/^https?:$/.test(parsed.protocol)) throw new Error("Only http and https URLs are supported.");\n  status("Fetching URL…");\n  const response = await fetch("/api/import-url", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ url: parsed.toString() }) });\n  const data = await response.json().catch(() => ({}));\n  if (!response.ok) throw new Error(data?.error || `URL returned ${response.status}.`);\n  return { text: typeof data?.text === "string" ? data.text : "", meta: typeof data?.title === "string" && data.title.trim() ? data.title.trim() : parsed.hostname, note: typeof data?.note === "string" ? data.note : "URL imported" };\n}\n'''
          u2 = re.sub(r'async function importUrl\([\\s\\S]*?\n}\n\nexport const Route', new_import + '\nexport const Route', u, count=1)
          if u2 == u: raise SystemExit('frontend importUrl replacement failed')
          u = u2
          replacement = '''  const handleUrl = async () => {\n    const value = url.trim();\n    if (!value) return;\n    setProcessing(true); setError(""); setStatus("Fetching URL…");\n    try { const result = await importUrl(value, setStatus); processResult(result, result.meta || new URL(value).hostname); setShowUrl(false); }\n    catch (e) { console.error(e); setStatus("URL import failed"); setError(e instanceof Error ? e.message : "This URL could not be imported."); }\n    finally { setProcessing(false); }\n  };'''
          u2 = re.sub(r'  const handleUrl = async \(\) => \{[\\s\\S]*?\n  \};', replacement, u, count=1)
          if u2 == u: raise SystemExit('frontend handleUrl replacement failed')
          ui.write_text(u2, encoding='utf-8')
      - name: Commit patched app
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/routes/api/import-url.ts src/routes/ai-workspace.tsx
          git diff --cached --quiet || git commit -m 'fix YouTube URL title import [skip yt final]'
          git push
